name: Build Package

on:
  workflow_dispatch:

  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Build Package
        run: |
          npm ci
          npm run webpack

      - name: Test Package
        run: |
          node dist/index.js \
            --file "examples/exampleA.yml"